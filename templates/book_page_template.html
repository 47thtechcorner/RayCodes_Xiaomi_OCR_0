<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Book Spread Digitizer: Xiaomi-OCR-0</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #080a0f; color: #e2e8f0; margin: 0; padding: 24px; }
    .container { max-width: 1240px; margin: 0 auto; }
    .header { border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; }
    .card img { width: 100%; border-radius: 8px; border: 1px solid #334155; }
    .text-box { font-family: 'Courier New', Courier, monospace; white-space: pre-wrap; line-height: 1.6; color: #38bdf8; font-size: 13.5px; background: #0b1120; padding: 16px; border-radius: 8px; border: 1px solid #1e293b; }
    .badge { display: inline-block; padding: 4px 10px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-radius: 6px; font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="badge">Complete Book Spread Ingestion</span>
      <h1 style="color: #fff; margin-top: 8px;">Printed Book Spread: Pages 94 & 95</h1>
      <p style="color: #94a3b8;">High-fidelity multi-column prose, factorial equations, and speech bubble digitization.</p>
    </div>
    <div class="grid">
      <div class="card">
        <h3 style="color: #cbd5e1; margin-top: 0;">Original Book Scan</h3>
        <img src="../{{image_path}}" alt="Original Book Page">
      </div>
      <div class="card">
        <h3 style="color: #cbd5e1; margin-top: 0;">Complete Model Transcription</h3>
        <div class="text-box">{{transcription}}</div>
      </div>
    </div>
  </div>
</body>
</html>
